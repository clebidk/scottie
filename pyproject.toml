[project]
name = "harness"
version = "0.2.0"
description = "Company-agnostic ad-to-landing-page harness. Tenants supply the data; the engine supplies the pipeline."
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Private :: Do Not Upload",
]
dependencies = [
    "anthropic",
    "python-dotenv",
    "jinja2",
    "pillow",
    "pyyaml",
    # harness/pagechecks.py's rendered-HTML validity backstop: a real HTML5
    # parser (strict mode reports unclosed tags / bad nesting), where the
    # stdlib html.parser never errors.
    "html5lib",
    # Cycle 26: harness/serve.py, the reviewer web app -- a small, mature
    # WSGI framework rather than hand-rolling routing/auth/multipart-form
    # parsing over the stdlib http.server.
    "flask",
]

[project.scripts]
harness = "harness.cli:main"
# Kept for one release so existing scripts and cron entries do not break.
# Prints a deprecation line to stderr, then runs the same CLI.
adv = "harness.cli:main_adv_alias"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = [
    "structure.css",
    "templates/*.html",
    "blocks/registry.json",
    "blocks/*/block.html",
    "blocks/*/block.css",
    "blocks/*/screenshot.svg",
    "design_skills/rules.json",
    "design_skills/SOURCE.json",
    "design_skills/LICENSE",
    "design_skills/README.md",
    "design_skills/landing-page-design/SKILL.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# --strict-markers so a typo'd marker is an error, not a silently ignored one.
# `-m "not live"` keeps the default run offline: a `live` test is one that
# genuinely needs the network or a real model call. There are none today; the
# marker exists so that adding one is a deliberate act rather than an accident.
addopts = "--strict-markers -m 'not live'"
markers = [
    "slow: more than a second of real work (image re-encoding). Still offline, still run by default.",
    "live: needs the network or a real model call. Deselected by default; run with `-m live`.",
]

[tool.ruff]
target-version = "py313"
# Wider than the default 88 because this codebase's prompt blocks are single
# long string literals sent to the model verbatim.
line-length = 120

[tool.ruff.lint]
# ruff's default rule set (E4 imports, E7 statements, E9 syntax, F pyflakes)
# plus flake8-bugbear. `ruff check` is clean at this selection.
select = ["E4", "E7", "E9", "F", "B"]

# E501 (line-too-long) is deliberately NOT selected. 806 of the ~860 findings
# at the wider selection were this rule, and almost all of them are the writer
# and ingest system prompts: single string literals whose wrapping would change
# the bytes sent to the model. Enforcing a column limit there would mean either
# reformatting prompts (a product change) or a noqa on every prompt line.
#
# I (isort) is not selected either: it is a pure-churn reordering across 20+
# files, which would bury a real diff. Worth doing as its own commit, alone.
ignore = [
    # A deliberate cycle-breaking or optional-dependency import inside a
    # function is not a mistake here -- harness/pipeline.py defers its
    # harness/cli.py imports to break the cycle finding R1 describes, and
    # harness/batch.py defers `anthropic` so importing the module never
    # requires the SDK to be installed.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# A test asserting on a raised exception reads better with a bare assert.
"tests/*" = ["B011"]
