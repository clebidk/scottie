# Skeleton tenant. Copy with `harness tenant init <name>`, then fill in every
# CHANGE ME. The engine reads company-specific strings only from this file,
# authors.yaml, vocab.yaml, and claims/config.json.

# The tenant file format this file is written against. `harness doctor` and
# every `harness` command check it; a mismatch stops the run with one line
# rather than half-reading a file whose keys have moved. Bumped only when a
# change would make an older tenant.yaml wrong, never when a key is added.
schema_version: 1

name: CHANGE ME            # display name, e.g. "Acme Saunas"
slug: CHANGE ME            # directory name, e.g. "acme-saunas"
site_url: https://CHANGE-ME.example
site_host: CHANGE-ME.example

shopify:
  products_json: https://CHANGE-ME.example/products.json
  product_url_template: "https://CHANGE-ME.example/products/{slug}"

reviews:
  source: none             # none | judgeme-live
  platform_name: CHANGE ME
  store_url: ""
  claim_template: "Rated {rating} out of 5 across {count} reviews on {platform_name} (fetched {date})."

price_claim_template: "The {tenant_name} {product_name} is priced at {price}."

theme:
  name: CHANGE ME
  root_class: pk-lp
  full_bleed_css: ""       # theme-specific CSS pasted at the top of shopify-body output

default_cta_url: /collections/all

# Optional. A prefix the storefront's own product titles carry that should
# never be shown or written ("Acme Saunas Fuji 2-Person ..." -> "Fuji
# 2-Person ..."). Stripped wherever a product name is displayed and wherever
# the writer is handed one; slugs, URLs and claim ids are never touched.
# Leave it out and nothing is stripped.
product_display_strip_prefix: ""

disclosure_text: >-
  This page is an advertisement published by {tenant_name}, which sells the
  products described. Every specific claim on this page is sourced; see Sources
  below. Prices were current as of the publish date above and may have changed
  since.

source_label_prefix: CHANGE ME
source_path_labels: {}
product_page_label: "{prefix} – {product_name} product page"
review_source_label: "{platform_name} reviews for {tenant_name}"
asset_alt_fallback: CHANGE ME

whisper_prompt: ""         # short vocabulary list: brand name, category words, model names

pdp_facts: {}              # fact-name -> list of literal phrases to look for in a product page

benefit_allowlist_ids: []       # product-benefit claims every page may cite
universal_claim_ids: []         # claims every product's facts_pack always carries
listicle_pack_models: []        # models a listicle asset pack covers, if any
warranty_claim_id: ""
excluded_benefit_ids: []
claim_id_prefixes: [spec-, price-, pdp-, reviews-]

default_cartridge_pool: [article, product-page, longform]

allow_ai_renders: false

# Cycle 30: per-cartridge overrides. article.warmup_window_words overrides
# cartridges/article/schema.json's own default (600 words) -- the article
# cartridge keeps pricing, the CTA, and the brand name out of this many
# words at the top of the page. article.warmup_mode is "warn" (advisory
# REVIEW.md line only -- the safe default for a new tenant) or "enforce"
# (a hard gate/repair-loop failure) -- turn "enforce" on only once this
# tenant's own baseline article page already passes at its chosen window.
cartridges:
  article:
    warmup_window_words: 600
    warmup_mode: warn

# Cycle 32: the simplicity gate (docs/RESEARCH-HORMOZI-LANDING.md section 3
# -- above-the-fold links, headline word band, one offer element per page;
# harness/simplicity.py). "warn" (the safe default for a new tenant):
# advisory REVIEW.md "Simplicity" section only. "enforce": those checks
# become hard gates through the writer repair loop, same as warmup_mode
# above -- turn it on only once this tenant's own baseline pages already
# pass warn mode cleanly.
simplicity_mode: warn

# Cycle 30: structural design references. Each slug names a folder under
# harness/design_skills/design-md/<slug>/DESIGN.md; the design-skills
# adapter takes only STRUCTURAL rules from it (hero style, whitespace
# scale, max content width, heading-to-body size ratio, image aspect,
# section rhythm) -- never fonts, colors, or the referenced brand's name,
# which stay this tenant's own brand layer. Safe to leave empty.
design_reference: []

# Cycle 17 (cost reduction): which model each stage calls. Any key left out
# falls back to harness/config.py's DEFAULT_MODELS -- a new tenant can delete
# this whole block and get the same defaults. write: the three cartridge
# writes. repair_first: the first repair attempt after a gate failure.
# repair_next: a second repair, if the first still fails. ingest: ad_brief
# extraction + still-image text transcription. matcher: claims.py's semantic
# claim matcher.
models:
  write: claude-sonnet-5
  repair_first: claude-haiku-4-5
  repair_next: claude-sonnet-5
  ingest: claude-haiku-4-5
  matcher: claude-haiku-4-5

# Cycle 16 item 9: consult-CTA variant. tenant_short_name is a short form of
# the company name for a consult-mode CTA phrase, e.g. "Talk to {tenant_short_name}".
# cta_mode: "buy" (leave every cartridge's own schema.json allowed_cta_texts
# unchanged -- the safe default for a new tenant), "consult" (every
# cartridge's allowed CTA texts become cta_variants.consult instead), or
# "auto" (consult only when the ad's own angle matches a high-consideration
# keyword -- see harness/write.py's HIGH_CONSIDERATION_ANGLE_KEYWORDS).
tenant_short_name: CHANGE ME
cta_mode: buy
cta_variants:
  buy: []
  consult: []

# Cycle 20 (run states, approval, publishing). Who may `harness
# approve`/`harness reject` a run -- an email not listed here is refused,
# with a one-line message, no traceback. role is "primary" or "backup",
# informational only today.
reviewers: []
#  - name: CHANGE ME
#    email: CHANGE ME
#    role: primary   # primary | backup

# Which adapter `harness publish` uses (harness/publishers/). "export" (the
# default, every new tenant starts here) writes a self-contained folder per
# page for manual upload -- no credentials needed. "shopify" calls the
# Shopify Admin REST API; needs SHOPIFY_STORE + SHOPIFY_TOKEN in this
# tenant's .env (scopes: write_content, write_files, read_content -- see
# docs/PUBLISHING.md).
publisher: export
shopify_publish:
  store: CHANGE-ME.example   # the storefront's own domain -- documentation only, not used for API calls
  store_admin_domain: null   # the *.myshopify.com admin domain; SHOPIFY_STORE (env) must hold this once known

# Reviewer notifications sent on: a run reaching needs_review, an approve,
# and a publish. Both channels are entirely optional and fail closed -- no
# SLACK_WEBHOOK_URL / SMTP_* in .env just logs a skip, never blocks a run
# or a command (harness/notify.py).
notifications:
  slack: false
  email: []

# Cycle 27: `harness brand import --tenant <slug> --drive-folder <url-or-id>`
# (or `--local <dir>`) fills this in from a logo/brand-guide/palette/fonts
# folder and merges it here -- logo_path, primary_hex, accent_hex,
# font_families. A value already here wins over a re-import unless --force.
# Safe to leave empty; nothing in the engine requires it.
brand: {}
