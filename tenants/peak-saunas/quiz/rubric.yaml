# tenants/peak-saunas/quiz/rubric.yaml -- the quiz cartridge's scoring rubric.
# GENERATED by build_rubric.py from claims/verified.json + claims/products.json
# (cycle 57). Weights are a first cut for Caleb to tune by hand; re-running the
# script overwrites hand edits. Model keys are product-name slugs (claim-id
# namespace), active models only. A comment above each option names the claim
# ids its scores were derived from.
#
# Placement scores 15: more than every other question's top score
# together (3+3+3+3+2 = 14), so placement works as a hard filter.
# Not scored: app control (no verified claim names it for any model).
#
# Cycle 61 display fields, hand-added (build_rubric.py does not write them,
# so re-add them after a regeneration; the page falls back to the label and
# a bare answer without them). A question's `result_label` leads a row of
# the result's "why it fits you" list; an option's `display` is its tile
# text when the label is longer than six words. Neither changes a label, a
# score or the order.
version: 1
questions:
  - id: household
    result_label: "Who uses it"
    prompt: "Who will use your sauna at the same time?"
    options:
      # capacity 1-Person scores 3, 2-Person scores 1
      # claims: spec-everest-capacity, spec-fuji-capacity, spec-mini-capacity, spec-patagonia-capacity, spec-rainier-capacity, spec-shasta-capacity
      - label: "Just me"
        scores: {everest: 1, fuji: 1, mini: 3, patagonia: 1, rainier: 3, shasta: 3}
      # capacity 2-Person scores 3, 3-Person scores 1
      # claims: spec-denali-capacity, spec-everest-capacity, spec-fuji-capacity, spec-matterhorn-capacity, spec-patagonia-capacity
      - label: "Two of us"
        scores: {denali: 1, everest: 3, fuji: 3, matterhorn: 1, patagonia: 3}
      # capacity 3- or 4-Person scores 3, 5-Person scores 1
      # claims: spec-denali-capacity, spec-el-capitan-capacity, spec-kilimanjaro-capacity, spec-matterhorn-capacity
      - label: "Three or four of us"
        scores: {denali: 3, el-capitan: 3, kilimanjaro: 1, matterhorn: 3}
      # capacity 5-Person scores 3, 4-Person scores 1
      # claims: spec-el-capitan-capacity, spec-kilimanjaro-capacity
      - label: "Five of us"
        scores: {el-capitan: 1, kilimanjaro: 3}
  - id: placement
    result_label: "Where it goes"
    prompt: "Where will it go?"
    options:
      # every model with no verified 'Placement: Outdoor' claim scores 15
      # claims: gbrain-everest-persons, gbrain-fuji-persons
      - label: "Inside the house"
        scores: {denali: 15, everest: 15, fuji: 15, matterhorn: 15, mini: 15, rainier: 15, shasta: 15}
      # every model with a verified 'Placement: Outdoor' claim scores 15
      # claims: spec-el-capitan-placement, spec-kilimanjaro-placement, spec-patagonia-placement
      - label: "Outside, on a patio, deck, or yard"
        display: "Outdoors, on a deck or patio"
        scores: {el-capitan: 15, kilimanjaro: 15, patagonia: 15}
  - id: space
    result_label: "Floor space"
    prompt: "How much floor space can you give it?"
    options:
      # larger exterior side up to 36 in scores 3
      # claims: spec-mini-dimensions
      - label: "A corner under 3 feet wide"
        scores: {mini: 3}
      # larger exterior side 36-48 in scores 3, the band below scores 1
      # claims: spec-mini-dimensions, spec-rainier-dimensions, spec-shasta-dimensions
      - label: "3 to 4 feet wide"
        scores: {mini: 1, rainier: 3, shasta: 3}
      # larger exterior side 48-60 in scores 3, the band below scores 1
      # claims: gbrain-everest-dimensions, gbrain-fuji-dimensions, spec-kilimanjaro-dimensions, spec-patagonia-dimensions, spec-rainier-dimensions, spec-shasta-dimensions
      - label: "4 to 5 feet wide"
        scores: {everest: 3, fuji: 3, kilimanjaro: 3, patagonia: 3, rainier: 1, shasta: 1}
      # larger exterior side over 60 in scores 3, the band below scores 1
      # claims: gbrain-everest-dimensions, gbrain-fuji-dimensions, spec-denali-dimensions, spec-el-capitan-dimensions, spec-kilimanjaro-dimensions, spec-matterhorn-dimensions, spec-patagonia-dimensions
      - label: "More than 5 feet wide"
        scores: {denali: 3, el-capitan: 3, everest: 1, fuji: 1, kilimanjaro: 1, matterhorn: 3, patagonia: 1}
  - id: power
    result_label: "Power"
    prompt: "Which outlet can it plug into?"
    options:
      # a verified 120V/15A standard-outlet claim scores 3
      # claims: spec-mini-electrical, spec-rainier-electrical, spec-shasta-electrical
      - label: "A standard household outlet"
        scores: {mini: 3, rainier: 3, shasta: 3}
      # a verified 120V/20A dedicated-outlet claim scores 3
      # claims: gbrain-everest-power, gbrain-fuji-power
      - label: "A dedicated 20-amp outlet"
        scores: {everest: 3, fuji: 3}
      # a verified 240V claim scores 3
      # claims: spec-denali-electrical-requirement, spec-el-capitan-electrical, spec-kilimanjaro-electrical, spec-matterhorn-electrical-requirement, spec-patagonia-electrical
      - label: "A 240-volt circuit I can have an electrician add"
        display: "A new 240-volt circuit"
        scores: {denali: 3, el-capitan: 3, kilimanjaro: 3, matterhorn: 3, patagonia: 3}
  - id: budget
    result_label: "Budget"
    prompt: "What budget are you working with?"
    options:
      # verified price under $6,000 scores 3
      # claims: price-mini
      - label: "Under $6,000"
        scores: {mini: 3}
      # verified price $6,000-$7,999 scores 3, the band below scores 1
      # claims: price-everest, price-mini, price-rainier, price-shasta
      - label: "$6,000 to $8,000"
        scores: {everest: 3, mini: 1, rainier: 3, shasta: 3}
      # verified price $8,000-$10,999 scores 3, the band below scores 1
      # claims: price-denali, price-everest, price-fuji, price-matterhorn, price-patagonia, price-rainier, price-shasta
      - label: "$8,000 to $11,000"
        scores: {denali: 3, everest: 1, fuji: 3, matterhorn: 3, patagonia: 3, rainier: 1, shasta: 1}
      # verified price $11,000 or more scores 3, the band below scores 1
      # claims: price-denali, price-el-capitan, price-fuji, price-kilimanjaro, price-matterhorn, price-patagonia
      - label: "More than $11,000"
        scores: {denali: 1, el-capitan: 3, fuji: 1, kilimanjaro: 3, matterhorn: 1, patagonia: 1}
  - id: priority
    result_label: "Your priority"
    prompt: "Which matters most to you?"
    options:
      # 2 verified RLT panels score 2, 1 panel scores 1
      # claims: gbrain-everest-rlt, gbrain-fuji-rlt, spec-denali-red-light, spec-el-capitan-red-light, spec-kilimanjaro-red-light, spec-matterhorn-red-light, spec-mini-red-light, spec-patagonia-red-light, spec-rainier-red-light, spec-shasta-red-light
      - label: "The most red light therapy"
        scores: {denali: 2, el-capitan: 2, everest: 1, fuji: 1, kilimanjaro: 1, matterhorn: 2, mini: 1, patagonia: 1, rainier: 1, shasta: 1}
      # a verified 'Canadian red cedar' cabin-material claim scores 2
      # claims: spec-fuji-cabin-material, spec-matterhorn-cabin-material, spec-rainier-cabin-material
      - label: "Red cedar wood"
        scores: {fuji: 2, matterhorn: 2, rainier: 2}
      # the highest verified max temperature (170°F) scores 2
      # claims: spec-el-capitan-max-temperature, spec-kilimanjaro-max-temperature, spec-patagonia-max-temperature
      - label: "The hottest sessions"
        scores: {el-capitan: 2, kilimanjaro: 2, patagonia: 2}
# Interstitials: one short educational line after each named question, written
# by the writer from verified claims only. `topic` is guidance, not copy.
interstitials:
  - after: placement
    topic: "What full spectrum infrared means, and that every model is full spectrum"
  - after: power
    topic: "Why the outlet decides the model: some plug into a standard outlet, some need an electrician"
  - after: budget
    topic: "What every model includes, whatever the price: free shipping and red light therapy standard"
# Ties go to the first model in this list: verified price, lowest first.
tiebreak: [mini, shasta, rainier, everest, fuji, denali, matterhorn, patagonia, kilimanjaro, el-capitan]
