# Who signs a generated page. The renderer injects the byline; the writer never
# writes it. brand/byline.html's own template appends the author's title after
# {{author}}, so `author.name` here is the bare name.
author:
  name: Austin Laudenslager
  title: Founder & CEO
  bio: >-
    Founder and CEO of PEAK. Writes the buyer-education pieces on the
    site and is responsible for every claim on every page published under
    the brand.
  page: https://peaksaunas.com/pages/austin-laudenslager

# Cycle 19 (Caleb's byline decision): contributor is the PEAK Editorial
# Team, not a named person -- the team byline credit that appears
# on every generated page. See `reviewer` below for the named person who
# checks specifications and sources.
contributor:
  name: PEAK Editorial Team
  bio: >-
    The PEAK team that assembles and edits every buyer-education page
    published under the brand.

# Cycle 19: reviewer is the named person responsible for reviewing every
# generated page's specifications and sources before it is published --
# distinct from `contributor` above.
reviewer:
  name: Caleb Niednagel
  title: Technology Lead
  bio: >-
    Technology Lead at PEAK. Reviews the specifications and sources on
    every generated page before it is published.

# Rendered as "Written by {author_name}" / "{contributor_name}" / "Reviewed by
# {reviewer_name}, {reviewer_title}".
byline_author_template: "Written by {author_name}"
byline_contributor_template: "{contributor_name}"
byline_reviewer_template: "Reviewed by {reviewer_name}, {reviewer_title}"
