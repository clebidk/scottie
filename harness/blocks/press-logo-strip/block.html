<div class="bk-press-logo-strip">
  {% if heading %}<p class="bk-press-logo-strip__heading">{{ heading }}</p>{% endif %}
  <ul class="bk-press-logo-strip__logos">
    {% for logo in logos %}
    <li><img src="{{ logo.url }}" alt="{{ logo.alt }}" {% if logo.width %}width="{{ logo.width }}" height="{{ logo.height }}"{% endif %}></li>
    {% endfor %}
  </ul>
</div>
