<div class="bk-comparison-table">
  <table>
    <thead>
      <tr>{% for column in columns %}<th scope="col">{{ column }}</th>{% endfor %}</tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        <th scope="row">{{ row.label }}</th>
        {% for cell in row.cells %}<td>{% if cell is mapping %}{{ cell.text }}{% else %}{{ cell }}{% endif %}</td>{% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
